name: Daily watcher
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: daily-watcher
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python watcher.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Job Watcher $(date -u +%F)"
          number=$(gh issue list --state all --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then gh issue edit "$number" --body-file data/issue.md; gh issue reopen "$number" || true; else gh issue create --title "$title" --body-file data/issue.md; fi
          gh issue list --state open --limit 100 --json number,title --jq ".[] | select((.title | startswith(\"Job Watcher \")) and .title != \"$title\") | .number" | while read -r n; do gh issue close "$n"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: collect
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
